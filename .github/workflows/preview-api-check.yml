name: Verify develop-v2 Preview APIs

on:
  push:
    branches: [develop-v2]
    paths-ignore:
      - 'verification/**'

permissions:
  contents: write
  id-token: write

jobs:
  verify-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop-v2

      - name: Get GitHub OIDC token for Vercel trusted access
        id: oidc
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken();
            core.setSecret(token);
            core.setOutput('token', token);

      - name: Wait for Vercel branch preview
        id: preview
        shell: bash
        env:
          VERCEL_OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        run: |
          set -euo pipefail
          BASE="https://oshiruoshi-git-develop-v2-djamuy12-2759s-projects.vercel.app"
          echo "BASE=$BASE" >> "$GITHUB_ENV"
          ok=0
          for i in $(seq 1 30); do
            code=$(curl -L -sS -D /tmp/status-headers.txt -o /tmp/status.json -w '%{http_code}' \
              -H "x-vercel-trusted-oidc-idp-token: $VERCEL_OIDC_TOKEN" \
              "$BASE/api/status" || true)
            echo "attempt=$i status=$code"
            echo "$code" > /tmp/status-code.txt
            if [ "$code" = "200" ]; then ok=1; break; fi
            sleep 5
          done
          if [ "$ok" != "1" ]; then exit 1; fi

      - name: Confirm Yahoo and Rakuten environment flags
        id: envcheck
        shell: bash
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const d=JSON.parse(fs.readFileSync('/tmp/status.json','utf8'));
          console.log(JSON.stringify({yahooShopping:d.yahooShopping,rakuten:d.rakuten,snapshot:d.snapshot},null,2));
          if(d.yahooShopping!==true) throw new Error('Yahoo Shopping env is not active in Preview');
          if(d.rakuten!==true) throw new Error('Rakuten env is not active in Preview');
          NODE

      - name: Run live product search
        id: livesearch
        shell: bash
        env:
          VERCEL_OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        run: |
          set -euo pipefail
          code=$(curl -L -sS -o /tmp/live.json -w '%{http_code}' \
            -H "x-vercel-trusted-oidc-idp-token: $VERCEL_OIDC_TOKEN" \
            --get --data-urlencode 'q=五条悟 アクスタ' "$BASE/api/live-search")
          echo "$code" > /tmp/live-code.txt
          test "$code" = "200"
          node - <<'NODE'
          const fs=require('fs');
          const d=JSON.parse(fs.readFileSync('/tmp/live.json','utf8'));
          const providers=d.providers||{};
          const summary={
            yahooShopping: providers.yahooShopping ? {ok:providers.yahooShopping.ok,count:providers.yahooShopping.count,error:providers.yahooShopping.error||null}:null,
            rakuten: providers.rakuten ? {ok:providers.rakuten.ok,count:providers.rakuten.count,error:providers.rakuten.error||null}:null,
            totalItems:Array.isArray(d.items)?d.items.length:0,
            sources:[...new Set((d.items||[]).map(x=>x.source))]
          };
          fs.writeFileSync('/tmp/live-summary.json',JSON.stringify(summary,null,2));
          console.log(JSON.stringify(summary,null,2));
          if(!providers.yahooShopping?.ok) throw new Error('Yahoo Shopping live search failed');
          if(!providers.rakuten?.ok) throw new Error('Rakuten live search failed');
          if((providers.yahooShopping.count||0)+(providers.rakuten.count||0)===0) throw new Error('Both APIs returned zero products for the test query');
          NODE

      - name: Save verification result to branch
        if: always()
        shell: bash
        run: |
          mkdir -p verification
          node - <<'NODE'
          const fs=require('fs');
          const read=(p,fallback='')=>{try{return fs.readFileSync(p,'utf8').trim()}catch{return fallback}};
          const parse=(p)=>{try{return JSON.parse(fs.readFileSync(p,'utf8'))}catch{return null}};
          const status=parse('/tmp/status.json');
          const live=parse('/tmp/live-summary.json');
          const headers=read('/tmp/status-headers.txt','');
          const rawBody=read('/tmp/status.json','');
          const type=(headers.match(/^content-type:\s*([^\r\n]+)/im)||[])[1]||null;
          const title=(rawBody.match(/<title[^>]*>([^<]+)<\/title>/i)||[])[1]||null;
          const text=rawBody.replace(/<script[\s\S]*?<\/script>/gi,' ').replace(/<style[\s\S]*?<\/style>/gi,' ').replace(/<[^>]+>/g,' ').replace(/&nbsp;/g,' ').replace(/\s+/g,' ').trim();
          const protection=/authentication required|log in|sign in|deployment protection|vercel authentication/i.test(text);
          const result={
            checkedAt:new Date().toISOString(),
            previewUrl:process.env.BASE||'https://oshiruoshi-git-develop-v2-djamuy12-2759s-projects.vercel.app',
            statusHttp:Number(read('/tmp/status-code.txt','0')),
            statusContentType:type,
            statusPageTitle:status?null:title,
            statusLooksProtected:status?false:protection,
            statusTextStart:status?null:text.slice(0,300),
            statusFlags:status?{yahooShopping:status.yahooShopping,rakuten:status.rakuten,snapshot:status.snapshot}:null,
            liveHttp:Number(read('/tmp/live-code.txt','0')),
            live,
            success:Boolean(status?.yahooShopping===true && status?.rakuten===true && live?.yahooShopping?.ok && live?.rakuten?.ok && ((live?.yahooShopping?.count||0)+(live?.rakuten?.count||0)>0))
          };
          fs.writeFileSync('verification/preview-api-status.json',JSON.stringify(result,null,2)+'\n');
          console.log(JSON.stringify(result,null,2));
          NODE
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add verification/preview-api-status.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record Preview API verification result"
          git push origin HEAD:develop-v2
