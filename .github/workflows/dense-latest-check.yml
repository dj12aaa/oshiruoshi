name: V9 dense grid and latest goods checks

on:
  push:
    branches:
      - 'work/**'
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: JavaScript syntax
        run: |
          node --check home-experience-v8.js
          node --check navigation-extra-v7.js
          node --check latest-goods.js
          node --check seo-structured-data.js
          node --check api/live-search.js
          node --check api/_live-search-v8.js
          node --check api/sitemap.js
          node --check app.js
          node --check performance-v3.js

      - name: Validate Vercel config and function budget
        run: |
          node scripts/check-vercel-function-budget.mjs
          node <<'NODE'
          const fs=require('fs');
          const config=JSON.parse(fs.readFileSync('vercel.json','utf8'));
          if(!(config.rewrites||[]).some(x=>x.source==='/latest-goods'&&x.destination==='/latest-goods.html'))throw new Error('latest-goods rewrite missing');
          if(!(config.rewrites||[]).some(x=>x.source==='/api/live-search-v8'&&x.destination==='/api/search'))throw new Error('live-search-v8 compatibility rewrite missing');
          console.log({vercel:'ok'});
          NODE

      - name: Validate v9 responsive gallery
        run: |
          node <<'NODE'
          const fs=require('fs');
          const css=fs.readFileSync('gallery-v8.css','utf8');
          for(const token of ['OSHIRU gallery v9','repeat(8,minmax(0,1fr))','repeat(7,minmax(0,1fr))','repeat(6,minmax(0,1fr))','repeat(4,minmax(0,1fr))','repeat(3,minmax(0,1fr))','.gallery-price','.gallery-compare','.gallery-compare.is-selected','aspect-ratio:1/1!important','overflow-x:hidden','#sourceAccessPanel{display:none!important}','content:none!important'])if(!css.includes(token))throw new Error(`v9 gallery invariant missing: ${token}`);
          const opens=(css.match(/\{/g)||[]).length,closes=(css.match(/\}/g)||[]).length;if(opens!==closes)throw new Error(`CSS brace mismatch ${opens}/${closes}`);
          NODE

      - name: Validate latest goods SEO and official-source hub
        run: |
          node <<'NODE'
          const fs=require('fs');
          const html=fs.readFileSync('latest-goods.html','utf8'),sitemap=fs.readFileSync('api/sitemap.js','utf8');
          const required=['<link rel="canonical" href="https://oshiruoshi.vercel.app/latest-goods">','"@type":"CollectionPage"','"@type":"ItemList"','shop.nijisanji.jp','shop.hololivepro.com','vspo.jp','games/apex-legends/apex-legends/news','pjsekai.sega.jp','jujutsukaisen.jp/news','tv.bluelock-pr.com/news','sanrio.co.jp/news','pokemoncenter-online.com','bts-official.jp','straykidsjapan.com','starto.jp','data-official-rail','data-live-until','SOLD OUT 8/23'];
          for(const token of required)if(!html.includes(token))throw new Error(`latest goods requirement missing: ${token}`);
          if(/"@type":"(?:Product|MerchantListing)"/.test(html))throw new Error('Product/MerchantListing must not be used on collection hub');
          if(!sitemap.includes("'/latest-goods'"))throw new Error('latest-goods missing from sitemap');
          NODE

      - name: Validate privacy, image search, taskbar and idle state
        run: |
          node <<'NODE'
          const fs=require('fs');
          const latest=fs.readFileSync('latest-goods.js','utf8'),home=fs.readFileSync('home-experience-v8.js','utf8'),affiliate=fs.readFileSync('affiliate-widget.js','utf8'),privacy=fs.readFileSync('privacy.html','utf8'),nav=fs.readFileSync('navigation-extra-v7.js','utf8'),html=fs.readFileSync('index.html','utf8'),seo=fs.readFileSync('seo-structured-data.js','utf8'),perf=fs.readFileSync('performance-v3.js','utf8');
          if(!latest.includes('localStorage'))throw new Error('local personalization missing');
          for(const token of ['createImageBitmap','MAX_DIMENSION=1600','/api/vision-search','removeLegacySourcePanel'])if(!home.includes(token))throw new Error(`image/search optimization missing: ${token}`);
          for(const token of ['画像検索','最新グッズ','/latest-goods'])if(!nav.includes(token))throw new Error(`taskbar item missing: ${token}`);
          for(const token of ['/gallery-v8.css?v=20260822-9','/home-experience-v8.js?v=20260823-14','/affiliate-widget.js?v=20260823-16','/navigation-extra-v7.js?v=20260822-9'])if(!html.includes(token))throw new Error(`critical asset missing: ${token}`);
          if(!home.includes("HOME_EXPERIENCE_VERSION='2026-08-23.14'")||home.includes('observe(grid,{childList:true,subtree:true,characterData:true})'))throw new Error('self-triggering gallery observer remains');
          for(const token of ["AFFILIATE_UI_VERSION='2026-08-23.16'","const compact=btn.classList.contains('gallery-compare')","if(btn.textContent!==glyph)btn.textContent=glyph"])if(!affiliate.includes(token))throw new Error(`compact compare invariant missing: ${token}`);
          if(/loadScript|data-gallery-v8|home-experience-v8/.test(seo))throw new Error('dynamic critical-asset bootstrap remains');
          if(!privacy.includes('最新グッズページ')||!privacy.includes('localStorage'))throw new Error('privacy disclosure missing');
          if(!perf.includes('idleResponse')||!perf.includes('enterIdle')||!perf.includes('/api/live-search-v8'))throw new Error('idle/precision routing protection missing');
          NODE

  production-smoke:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Verify live v8 assets, latest-goods and search APIs
        shell: bash
        run: |
          set -euo pipefail
          base='https://oshiruoshi.vercel.app'
          tmp="$(mktemp -d)"; trap 'rm -rf "$tmp"' EXIT
          ready=0
          for attempt in $(seq 1 36); do
            if curl --fail --silent --show-error --location "$base/?ready=$attempt-${GITHUB_SHA}" -o "$tmp/index.html" \
              && grep -Fq 'oshiru-search-ui-version" content="2026-09-05.18' "$tmp/index.html" \
              && grep -Fq '/app.js?v=20260905-18' "$tmp/index.html" \
              && curl --fail --silent --show-error --location "$base/app.js?v=20260905-18-$attempt" -o "$tmp/app.js" \
              && grep -Fq "SEARCH_UI_VERSION='2026-09-05.18'" "$tmp/app.js" \
              && grep -Fq 'oshiru-home-version" content="2026-08-23.14' "$tmp/index.html" \
              && grep -Fq '/home-experience-v8.js?v=20260823-14' "$tmp/index.html" \
              && curl --fail --silent --show-error --location "$base/home-experience-v8.js?v=20260823-14-$attempt" -o "$tmp/home.js" \
              && grep -Fq "HOME_EXPERIENCE_VERSION='2026-08-23.14'" "$tmp/home.js" \
              && grep -Fq 'oshiru-affiliate-ui-version" content="2026-08-23.16' "$tmp/index.html" \
              && grep -Fq '/affiliate-widget.js?v=20260823-16' "$tmp/index.html" \
              && curl --fail --silent --show-error --location "$base/affiliate-widget.js?v=20260823-16-$attempt" -o "$tmp/affiliate.js" \
              && grep -Fq "AFFILIATE_UI_VERSION='2026-08-23.16'" "$tmp/affiliate.js" \
              && curl --fail --silent --show-error --location "$base/gallery-v8.css?v=$attempt-${GITHUB_SHA}" -o "$tmp/gallery.css" \
              && grep -Fq 'OSHIRU gallery v9' "$tmp/gallery.css"; then
              ready=1
              break
            fi
            sleep 5
          done
          test "$ready" = 1
          bash .github/scripts/verify-production-seo.sh "$base" "$tmp" 36
          curl --fail --silent --show-error --location --retry 8 --retry-all-errors --retry-delay 4 "$base/latest-goods" -o "$tmp/latest.html"
          grep -Fq 'data-official-rail' "$tmp/latest.html"
          grep -Fq 'CollectionPage' "$tmp/latest.html"
          grep -Fq 'repeat(8,minmax(0,1fr))' "$tmp/gallery.css"
          grep -Fq 'repeat(3,minmax(0,1fr))' "$tmp/gallery.css"
          grep -Fq '#sourceAccessPanel{display:none!important}' "$tmp/gallery.css"
          grep -Fq '.image-search-head{min-height:48px;padding-right:58px' "$tmp/gallery.css"
          grep -Fq 'createImageBitmap' "$tmp/home.js"
          grep -Fq 'removeLegacySourcePanel' "$tmp/home.js"
          curl --fail --silent --show-error --location --retry 8 --retry-all-errors --retry-delay 4 "$base/navigation-extra-v7.js" -o "$tmp/nav.js"
          grep -Fq '画像検索' "$tmp/nav.js"; grep -Fq '最新グッズ' "$tmp/nav.js"
          curl --fail --silent --show-error --location --retry 8 --retry-all-errors --retry-delay 4 "$base/api/search?q=" -o "$tmp/idle.json"
          node -e "const d=require(process.argv[1]); if(!d.idle||!Array.isArray(d.items)||d.items.length!==0) process.exit(1)" "$tmp/idle.json"
          curl --fail --silent --show-error --location --retry 8 --retry-all-errors --retry-delay 4 "$base/api/live-search-v8?q=%E3%83%8A%E3%83%AB%E3%83%88" -o "$tmp/live.json"
          node -e "const d=require(process.argv[1]); if(d.precisionVersion!=='2026-09-05.18'||!Array.isArray(d.items)||!String(d.effectiveQuery||'').includes('グッズ')) process.exit(1)" "$tmp/live.json"
          echo 'Production v9 HTTP smoke passed.'
