name: OSHIRU search quality

on:
  push:
    branches: [main]
    paths-ignore:
      - 'verification/**'

permissions:
  contents: write

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Search JavaScript syntax
        run: |
          node --check api/_search-language.mjs
          node --check api/live-search.js
          node --check api/suggest.js
          node --check app.js
          node --check predictive-mobile.js
      - name: Wait for production
        shell: bash
        run: |
          for i in $(seq 1 30); do
            if curl -fsSL https://oshiruoshi.vercel.app/performance-v3.js >/dev/null && curl -fsSL https://oshiruoshi.vercel.app/design-v3.css >/dev/null; then break; fi
            sleep 5
          done
      - name: Search flexible queries
        shell: bash
        run: |
          mkdir -p /tmp/oshiru-quality
          QUERIES=(
            '星街すいせい アクスタ'
            '五条悟 缶バッジ'
            '初音ミク ぬい'
            'ローレンイロアスアクキー'
            'ボイスキーホルダーFelix'
            'Felix ボイスキーホルダー'
            'owキリコぬいぐるみ'
            'OW キリコ ぬい'
            '3DS本体'
          )
          for n in "${!QUERIES[@]}"; do
            curl --max-time 40 -fsSL --get --data-urlencode "q=${QUERIES[$n]}" https://oshiruoshi.vercel.app/api/live-search > "/tmp/oshiru-quality/q${n}.json"
            sleep 2
          done
          SUGGEST=('3DS' 'owキリコ' 'ボイスキーホルダーFelix' 'felix ボイス キーホルダー ホルダー スキズ')
          for n in "${!SUGGEST[@]}"; do
            curl --max-time 20 -fsSL --get --data-urlencode "q=${SUGGEST[$n]}" https://oshiruoshi.vercel.app/api/suggest > "/tmp/oshiru-quality/s${n}.json"
            sleep 2
          done
      - name: Record quality result
        shell: bash
        run: |
          mkdir -p verification
          node - <<'NODE'
          const fs=require('fs');
          const specs=[
            {query:'星街すいせい アクスタ'},
            {query:'五条悟 缶バッジ'},
            {query:'初音ミク ぬい'},
            {query:'ローレンイロアスアクキー',mustInclude:'アクリルキーホルダー'},
            {query:'ボイスキーホルダーFelix',mustInclude:'ボイスキーホルダー'},
            {query:'Felix ボイスキーホルダー',mustInclude:'ボイスキーホルダー'},
            {query:'owキリコぬいぐるみ',mustInclude:'オーバーウォッチ',alsoInclude:'ぬいぐるみ'},
            {query:'OW キリコ ぬい',mustInclude:'オーバーウォッチ',alsoInclude:'ぬいぐるみ'},
            {query:'3DS本体',mustInclude:'3ds 本体'}
          ];
          const norm=v=>String(v||'').normalize('NFKC').toLowerCase().replace(/[・･·／/|｜,，。｡()（）【】\[\]「」『』〈〉《》:_＿\-—–+＋]+/g,' ').replace(/([a-z0-9])([ぁ-んァ-ヶ一-龯々ー])/gi,'$1 $2').replace(/([ぁ-んァ-ヶ一-龯々ー])([a-z0-9])/gi,'$1 $2').replace(/\s+/g,' ').trim();
          const results=specs.map((spec,n)=>{
            const d=JSON.parse(fs.readFileSync(`/tmp/oshiru-quality/q${n}.json`,'utf8'));
            const items=Array.isArray(d.items)?d.items:[];
            const variants=(d.queryVariants||[]).map(v=>typeof v==='string'?v:v?.query).filter(Boolean);
            const hay=variants.map(norm).join(' | ');
            const expansionOk=(!spec.mustInclude||hay.includes(norm(spec.mustInclude)))&&(!spec.alsoInclude||hay.includes(norm(spec.alsoInclude)));
            const scores=items.slice(0,5).map(x=>x._score);
            return{query:spec.query,count:items.length,queryVariants:variants,expansionOk,topTitles:items.slice(0,3).map(x=>x.title),topScores:scores,aliasVersion:d.aliasVersion||null};
          });
          const suggestQueries=['3DS','owキリコ','ボイスキーホルダーFelix','felix ボイス キーホルダー ホルダー スキズ'];
          const suggestions=suggestQueries.map((query,n)=>{
            const d=JSON.parse(fs.readFileSync(`/tmp/oshiru-quality/s${n}.json`,'utf8'));
            return{query,count:Array.isArray(d.items)?d.items.length:0,items:(d.items||[]).slice(0,8).map(x=>({name:x.name,kind:x.kind,label:x.label,detail:x.detail})),providerQuery:d.providerQuery||null,signals:d.signals||null};
          });
          const expansionOk=results.every(x=>x.expansionOk&&x.topScores.every(Number.isFinite));
          const baselineOk=results.slice(0,3).every(x=>x.count>0);
          const generated=suggestions.flatMap(x=>x.items).filter(x=>x.label!=='このまま検索');
          const duplicatePattern=/(キーホルダー\s*ホルダー|ホルダー\s*キーホルダー|ボイス\s*キーホルダー\s*ホルダー)/i;
          const duplicateFree=generated.every(x=>!duplicatePattern.test(norm(x.name)));
          const malformed=suggestions.find(x=>x.query.startsWith('felix ボイス'));
          const cleanupPresent=Boolean(malformed?.items?.some(x=>x.label==='重複・表記整理'&&norm(x.name).includes(norm('felix スキズ ボイスキーホルダー'))));
          const predictiveOk=suggestions.every(x=>x.count>0)&&duplicateFree&&cleanupPresent;
          const out={checkedAt:new Date().toISOString(),ok:expansionOk&&baselineOk&&predictiveOk,expansionOk,baselineOk,predictiveOk,duplicateFree,cleanupPresent,results,suggestions};
          fs.writeFileSync('verification/search-quality.json',JSON.stringify(out,null,2)+'\n');
          console.log(JSON.stringify(out,null,2));
          if(!out.ok)process.exitCode=1;
          NODE
      - name: Save result
        if: always()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "4189826+github-actions[bot]@users.noreply.github.com"
          git add verification/search-quality.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Record search quality result'
          git push origin HEAD:main
