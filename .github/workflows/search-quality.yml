name: OSHIRU search quality

on:
  push:
    branches: [main]
    paths-ignore:
      - 'verification/**'

permissions:
  contents: write

concurrency:
  group: oshiru-production-verification-writers
  cancel-in-progress: false
  queue: max

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Search JavaScript syntax
        run: |
          node --check api/_search-language.mjs
          node --check api/live-search.js
          node --check api/suggest.js
          node --check app.js
          node --check predictive-mobile.js
      - name: Wait for production
        shell: bash
        run: |
          for i in $(seq 1 30); do
            if curl -fsSL https://oshiruoshi.vercel.app/performance-v3.js >/dev/null && curl -fsSL https://oshiruoshi.vercel.app/design-v3.css >/dev/null; then break; fi
            sleep 5
          done
      - name: Search flexible queries
        shell: bash
        run: |
          mkdir -p /tmp/oshiru-quality
          QUERIES=(
            '星街すいせい アクスタ'
            '五条悟 缶バッジ'
            '初音ミク ぬい'
            'ローレンイロアスアクキー'
            'ボイスキーホルダーFelix'
            'Felix ボイスキーホルダー'
            'owキリコぬいぐるみ'
            'OW キリコ ぬい'
            'Felix キーホルダー'
            '五条悟 アクスラ'
            '星町すいせい アクスタ'
            '五条悟 サンリオ'
            '3DS本体'
          )
          for n in "${!QUERIES[@]}"; do
            curl --max-time 40 -fsSL --get --data-urlencode "q=${QUERIES[$n]}" https://oshiruoshi.vercel.app/api/live-search-v8 > "/tmp/oshiru-quality/q${n}.json"
            sleep 2
          done
          SUGGEST=('3DS' 'owキリコ' 'ボイスキーホルダーFelix' 'felix ボイス キーホルダー ホルダー スキズ')
          for n in "${!SUGGEST[@]}"; do
            curl --max-time 20 -fsSL --get --data-urlencode "q=${SUGGEST[$n]}" https://oshiruoshi.vercel.app/api/suggest > "/tmp/oshiru-quality/s${n}.json"
            sleep 2
          done
      - name: Record quality result
        shell: bash
        run: |
          mkdir -p verification
          node - <<'NODE'
          const fs=require('fs');
          const specs=[
            {query:'星街すいせい アクスタ',baseline:true},
            {query:'五条悟 缶バッジ',baseline:true},
            {query:'初音ミク ぬい',baseline:true},
            {query:'ローレンイロアスアクキー',mustInclude:['アクリルキーホルダー']},
            {query:'ボイスキーホルダーFelix',kind:'felix',mustInclude:['stray kids','フィリックス','ボイスキーホルダー']},
            {query:'Felix ボイスキーホルダー',kind:'felix',mustInclude:['stray kids','フィリックス','ボイスキーホルダー']},
            {query:'owキリコぬいぐるみ',kind:'kiriko',mustInclude:['オーバーウォッチ','キリコ','ぬいぐるみ']},
            {query:'OW キリコ ぬい',kind:'kiriko',mustInclude:['オーバーウォッチ','キリコ','ぬいぐるみ']},
            {query:'Felix キーホルダー',kind:'felix-generic',baseline:true,mustInclude:['stray kids','フィリックス','キーホルダー']},
            {query:'五条悟 アクスラ',kind:'gojo-acrylic',baseline:true,mustInclude:['呪術廻戦','五条悟','アクリルスタンド']},
            {query:'星町すいせい アクスタ',kind:'suisei-acrylic',baseline:true,mustInclude:['ホロライブ','星街すいせい','アクリルスタンド']},
            {query:'五条悟 サンリオ',kind:'gojo-sanrio',baseline:true,mustInclude:['呪術廻戦','五条悟','サンリオ']},
            {query:'3DS本体',mustInclude:['3ds 本体']}
          ];
          const norm=v=>String(v||'').normalize('NFKC').toLowerCase().replace(/[・･·／/|｜,，。｡()（）【】\[\]「」『』〈〉《》:_＿\-—–+＋]+/g,' ').replace(/([a-z0-9])([ぁ-んァ-ヶ一-龯々ー])/gi,'$1 $2').replace(/([ぁ-んァ-ヶ一-龯々ー])([a-z0-9])/gi,'$1 $2').replace(/\s+/g,' ').trim();
          const results=specs.map((spec,n)=>{
            const d=JSON.parse(fs.readFileSync(`/tmp/oshiru-quality/q${n}.json`,'utf8'));
            const items=Array.isArray(d.items)?d.items:[];
            const variants=(d.queryVariants||[]).map(v=>typeof v==='string'?v:v?.query).filter(Boolean);
            const hay=[d.effectiveQuery,...variants].map(norm).join(' | ');
            const expansionOk=(spec.mustInclude||[]).every(value=>hay.includes(norm(value)));
            const scores=items.slice(0,5).map(x=>x._score);
            const text=item=>norm([item.title,item.description,item.series,item.character,item.type,item.collab,item.shop,...(item.tags||[])].filter(Boolean).join(' '));
            const felixOk=item=>/(stray\s*kids|straykids|skz|スキズ)/i.test(text(item))&&/(felix|フィリックス|ピリ|bbokari|bokari|ボッカリ)/i.test(text(item))&&/(ボイス\s*キー|voice\s*key)/i.test(text(item));
            const felixGenericOk=item=>/(stray\s*kids|straykids|skz|スキズ)/i.test(text(item))&&/(felix|フィリックス|ピリ|bbokari|bokari|ボッカリ)/i.test(text(item))&&/(キーホルダー|キーチェーン|key\s*(?:holder|chain))/i.test(text(item));
            const kirikoOk=item=>/(overwatch|オーバーウォッチ|\bow2?\b)/i.test(text(item))&&/(kiriko|キリコ)/i.test(text(item))&&/(ぬい|マスコット|plush)/i.test(text(item));
            const gojoAcrylicOk=item=>/(呪術廻戦|jujutsu)/i.test(text(item))&&/五条\s*悟|ごじょうさとる|gojo\s*satoru/i.test(text(item))&&/(アクスタ|アクリルスタンド|acrylic\s*stand)/i.test(text(item));
            const suiseiAcrylicOk=item=>/星街\s*すいせい|hoshimachi\s*suisei/i.test(text(item))&&/(アクスタ|アクリルスタンド|acrylic\s*stand)/i.test(text(item));
            const gojoSanrioOk=item=>/五条\s*悟|ごじょうさとる|gojo\s*satoru/i.test(text(item))&&/(サンリオ|シナモロール|sanrio|cinnamoroll)/i.test(text(item));
            const relevanceOk=spec.kind==='felix'?items.every(felixOk):spec.kind==='felix-generic'?items.every(felixGenericOk):spec.kind==='kiriko'?items.every(kirikoOk):spec.kind==='gojo-acrylic'?items.every(gojoAcrylicOk):spec.kind==='suisei-acrylic'?items.every(suiseiAcrylicOk):spec.kind==='gojo-sanrio'?items.every(gojoSanrioOk):true;
            const signatures=items.map(item=>`${norm(item.source)}|${norm(item.title)}`);
            const uniqueTitlesOk=new Set(signatures).size===signatures.length;
            return{query:spec.query,count:items.length,effectiveQuery:d.effectiveQuery||null,resolvedQuery:d.resolvedQuery||null,precisionVersion:d.precisionVersion||null,queryVariants:variants,expansionOk,relevanceOk,uniqueTitlesOk,topTitles:items.slice(0,3).map(x=>x.title),topScores:scores,aliasVersion:d.aliasVersion||null};
          });
          const suggestQueries=['3DS','owキリコ','ボイスキーホルダーFelix','felix ボイス キーホルダー ホルダー スキズ'];
          const suggestions=suggestQueries.map((query,n)=>{
            const d=JSON.parse(fs.readFileSync(`/tmp/oshiru-quality/s${n}.json`,'utf8'));
            return{query,count:Array.isArray(d.items)?d.items.length:0,items:(d.items||[]).slice(0,8).map(x=>({name:x.name,kind:x.kind,label:x.label,detail:x.detail})),providerQuery:d.providerQuery||null,signals:d.signals||null};
          });
          const expansionOk=results.every(x=>x.expansionOk&&x.precisionVersion==='2026-09-05.18');
          const baselineOk=specs.every((spec,index)=>!spec.baseline||results[index].count>0);
          const relevanceOk=results.every(x=>x.relevanceOk);
          const uniqueTitlesOk=results.every(x=>x.uniqueTitlesOk);
          const generated=suggestions.flatMap(x=>x.items).filter(x=>x.label!=='このまま検索');
          const duplicatePattern=/(キーホルダー\s*ホルダー|ホルダー\s*キーホルダー|ボイス\s*キーホルダー\s*ホルダー)/i;
          const duplicateFree=generated.every(x=>!duplicatePattern.test(norm(x.name)));
          const malformed=suggestions.find(x=>x.query.startsWith('felix ボイス'));
          const cleanupPresent=Boolean(malformed?.items?.some(x=>x.label==='表記を整理'&&norm(x.name).includes(norm('stray kids フィリックス'))&&norm(x.name).includes(norm('ボイスキーホルダー'))));
          const predictiveOk=suggestions.every(x=>x.count>0)&&duplicateFree&&cleanupPresent;
          const out={checkedAt:new Date().toISOString(),ok:expansionOk&&baselineOk&&relevanceOk&&uniqueTitlesOk&&predictiveOk,expansionOk,baselineOk,relevanceOk,uniqueTitlesOk,predictiveOk,duplicateFree,cleanupPresent,results,suggestions};
          fs.writeFileSync('verification/search-quality.json',JSON.stringify(out,null,2)+'\n');
          console.log(JSON.stringify(out,null,2));
          if(!out.ok)process.exitCode=1;
          NODE
      - name: Save result
        if: always()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add verification/search-quality.json
          bash .github/scripts/push-verification.sh 'Record search quality result'
