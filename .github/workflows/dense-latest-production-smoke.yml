name: Dense latest production smoke

on:
  push:
    branches: [main]
    paths-ignore:
      - 'verification/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dense-latest-production-smoke
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Verify live production HTTP responses
        shell: bash
        run: |
          set -euo pipefail
          base='https://oshiruoshi.vercel.app'
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT

          curl --fail --silent --show-error --location --retry 5 --retry-all-errors --retry-delay 3 "$base/latest-goods" -o "$tmp/latest.html"
          grep -Fq '<link rel="canonical" href="https://oshiruoshi.vercel.app/latest-goods">' "$tmp/latest.html"
          grep -Fq '最新グッズ情報' "$tmp/latest.html"
          grep -Fq 'CollectionPage' "$tmp/latest.html"
          for domain in shop.nijisanji.jp shop.hololivepro.com vspo.jp pjsekai.sega.jp jujutsukaisen.jp sanrio.co.jp pokemoncenter-online.com bts-official.jp straykidsjapan.com starto.jp; do
            grep -Fq "$domain" "$tmp/latest.html"
          done

          curl --fail --silent --show-error --location --retry 5 --retry-all-errors --retry-delay 3 "$base/sitemap.xml" -o "$tmp/sitemap.xml"
          grep -Fq '<loc>https://oshiruoshi.vercel.app/latest-goods</loc>' "$tmp/sitemap.xml"

          curl --fail --silent --show-error --location --retry 5 --retry-all-errors --retry-delay 3 "$base/design-v3.css" -o "$tmp/design.css"
          grep -Fq 'Dense comparison mode v6' "$tmp/design.css"
          grep -Fq 'repeat(6,minmax(0,1fr))' "$tmp/design.css"
          grep -Fq 'repeat(5,minmax(0,1fr))' "$tmp/design.css"
          grep -Fq 'repeat(4,minmax(0,1fr))' "$tmp/design.css"
          grep -Fq 'repeat(3,minmax(0,1fr))' "$tmp/design.css"
          grep -Fq 'repeat(2,minmax(0,1fr))' "$tmp/design.css"
          grep -Fq '.product-card .source-pill' "$tmp/design.css"
          grep -Fq '.product-card .main-price' "$tmp/design.css"

          curl --fail --silent --show-error --location --retry 5 --retry-all-errors --retry-delay 3 "$base/home-experience-v6.js" -o "$tmp/home.js"
          grep -Fq 'oshiru-interest-signals-v1' "$tmp/home.js"
          grep -Fq 'createImageBitmap' "$tmp/home.js"
          grep -Fq '/api/vision-search' "$tmp/home.js"

          curl --fail --silent --show-error --location --retry 5 --retry-all-errors --retry-delay 3 "$base/privacy.html" -o "$tmp/privacy.html"
          grep -Fq '最新グッズページ' "$tmp/privacy.html"
          grep -Fq 'localStorage' "$tmp/privacy.html"

          curl --fail --silent --show-error --location --retry 5 --retry-all-errors --retry-delay 3 "$base/api/search?q=" -o "$tmp/idle.json"
          node -e "const d=require(process.argv[1]); if(!d.idle||!Array.isArray(d.items)||d.items.length!==0) throw new Error('empty search is not idle')" "$tmp/idle.json"

          curl --fail --silent --show-error --location --retry 5 --retry-all-errors --retry-delay 3 "$base/api/search?q=%E4%BA%94%E6%9D%A1%E6%82%9F" -o "$tmp/search.json"
          node -e "const d=require(process.argv[1]); if(!Array.isArray(d.items)) throw new Error('search items missing')" "$tmp/search.json"

      - name: Install Chromium test runtime
        shell: bash
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Verify mobile and desktop product layouts in Chromium
        shell: bash
        run: |
          mkdir -p verification/screenshots
          node <<'NODE'
          const fs=require('fs');
          const {chromium}=require('playwright');
          const base='https://oshiruoshi.vercel.app';

          async function inspect(browser,name,viewport,expectedColumns){
            const context=await browser.newContext({viewportSize:viewport,locale:'ja-JP'});
            const page=await context.newPage();
            await page.goto(`${base}/?q=${encodeURIComponent('五条悟')}`,{waitUntil:'domcontentloaded',timeout:45000});
            await page.waitForSelector('.product-card',{state:'visible',timeout:45000});
            await page.waitForFunction(()=>document.querySelectorAll('.product-card').length>=2,null,{timeout:45000});
            await page.waitForTimeout(700);
            const metrics=await page.evaluate(()=>{
              const grid=document.querySelector('#productGrid');
              const card=grid?.querySelector('.product-card');
              const source=card?.querySelector('.source-pill');
              const price=card?.querySelector('.main-price');
              const gridStyle=grid?getComputedStyle(grid):null;
              const cols=gridStyle?.gridTemplateColumns?.split(/\s+/).filter(Boolean).length||0;
              const visible=el=>!!el&&getComputedStyle(el).display!=='none'&&getComputedStyle(el).visibility!=='hidden'&&el.getBoundingClientRect().width>0&&el.getBoundingClientRect().height>0;
              const gridRect=grid?.getBoundingClientRect();
              return{
                cards:grid?.querySelectorAll('.product-card').length||0,
                columns:cols,
                sourceVisible:visible(source),
                sourceText:source?.textContent?.trim()||'',
                priceVisible:visible(price),
                priceText:price?.textContent?.trim()||'',
                gridInsideViewport:!!gridRect&&gridRect.left>=-1&&gridRect.right<=innerWidth+1,
                bodyOverflow:document.documentElement.scrollWidth<=innerWidth+2
              };
            });
            if(metrics.columns!==expectedColumns)throw new Error(`${name}: expected ${expectedColumns} columns, got ${metrics.columns}`);
            if(metrics.cards<2)throw new Error(`${name}: insufficient product cards`);
            if(!metrics.sourceVisible||!metrics.sourceText)throw new Error(`${name}: source marketplace is not visible`);
            if(!metrics.priceVisible||!metrics.priceText)throw new Error(`${name}: price is not visible`);
            if(!metrics.gridInsideViewport)throw new Error(`${name}: product grid exceeds viewport`);
            await page.screenshot({path:`verification/screenshots/${name}.png`,fullPage:false});

            await page.goto(`${base}/latest-goods`,{waitUntil:'domcontentloaded',timeout:45000});
            await page.waitForSelector('h1',{state:'visible',timeout:20000});
            const latest=await page.evaluate(()=>({
              h1:document.querySelector('h1')?.textContent?.trim()||'',
              sourceCards:document.querySelectorAll('.official-source-card').length,
              horizontalOverflow:document.documentElement.scrollWidth>innerWidth+2,
              localPreferenceButtons:document.querySelectorAll('[data-interest]').length
            }));
            if(!latest.h1.includes('最新グッズ'))throw new Error(`${name}: latest-goods heading missing`);
            if(latest.sourceCards<10)throw new Error(`${name}: official source directory is too small`);
            if(latest.horizontalOverflow)throw new Error(`${name}: latest-goods has horizontal overflow`);
            if(latest.localPreferenceButtons<5)throw new Error(`${name}: personalization controls missing`);
            await page.screenshot({path:`verification/screenshots/${name}-latest.png`,fullPage:false});
            await context.close();
            return{...metrics,latest};
          }

          (async()=>{
            const browser=await chromium.launch({headless:true});
            try{
              const mobile=await inspect(browser,'mobile-390x844',{width:390,height:844},2);
              const desktop=await inspect(browser,'desktop-1440x900',{width:1440,height:900},6);
              fs.writeFileSync('verification/dense-latest-ui-metrics.json',JSON.stringify({checkedAt:new Date().toISOString(),mobile,desktop},null,2)+'\n');
            }finally{await browser.close()}
          })().catch(error=>{console.error(error);process.exit(1)});
          NODE

      - uses: actions/upload-artifact@v4
        with:
          name: dense-latest-production-screenshots
          path: verification/screenshots/*.png
          if-no-files-found: error
          retention-days: 7

      - name: Record successful verification
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          node <<'NODE'
          const fs=require('fs');
          const ui=JSON.parse(fs.readFileSync('verification/dense-latest-ui-metrics.json','utf8'));
          fs.writeFileSync('verification/dense-latest-production.json',JSON.stringify({
            ok:true,
            production:'https://oshiruoshi.vercel.app',
            checkedAt:new Date().toISOString(),
            workflowSha:process.env.GITHUB_SHA,
            checks:[
              'latest-goods-200-and-canonical',
              'official-source-links-present',
              'sitemap-latest-goods',
              'dense-grid-css-6-5-4-3-2-columns',
              'source-and-price-css-visible',
              'image-search-client-optimization-asset',
              'privacy-local-personalization',
              'empty-search-idle',
              'nonempty-search-api-shape',
              'chromium-mobile-390x844-two-columns',
              'chromium-desktop-1440x900-six-columns',
              'chromium-price-and-source-visible',
              'chromium-latest-goods-no-horizontal-overflow'
            ],
            ui
          },null,2)+'\n');
          NODE
          git add verification/dense-latest-production.json verification/dense-latest-ui-metrics.json
          git commit -m 'Record dense latest browser verification'
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            git pull --rebase origin main
            sleep 2
          done
          exit 1
