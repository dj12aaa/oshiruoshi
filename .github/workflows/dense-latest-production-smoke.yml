name: V9 production browser verification

on:
  push:
    branches: [main]
    paths-ignore:
      - 'verification/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: oshiru-production-verification-writers
  cancel-in-progress: false
  queue: max

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Wait for v9 production and verify HTTP
        shell: bash
        run: |
          set -euo pipefail
          base='https://oshiruoshi.vercel.app'
          tmp="$(mktemp -d)"; trap 'rm -rf "$tmp"' EXIT

          ready=0
          for attempt in $(seq 1 45); do
            if curl --fail --silent --show-error --location "$base/?ready=$attempt-${GITHUB_SHA}" -o "$tmp/index.html" \
              && grep -Fq 'oshiru-search-ui-version" content="2026-09-08.24' "$tmp/index.html" \
              && grep -Fq '/app.js?v=20260908-24' "$tmp/index.html" \
              && curl --fail --silent --show-error --location "$base/app.js?v=20260908-24-$attempt" -o "$tmp/app.js" \
              && grep -Fq "SEARCH_UI_VERSION='2026-09-08.24'" "$tmp/app.js" \
              && grep -Fq 'oshiru-home-version" content="2026-08-23.14' "$tmp/index.html" \
              && grep -Fq '/home-experience-v8.js?v=20260823-14' "$tmp/index.html" \
              && curl --fail --silent --show-error --location "$base/gallery-v8.css?v=$(date +%s)" -o "$tmp/gallery.css" \
              && grep -Fq 'OSHIRU gallery v9' "$tmp/gallery.css" \
              && curl --fail --silent --show-error --location "$base/home-experience-v8.js?v=20260823-14-$attempt" -o "$tmp/home.js" \
              && grep -Fq "HOME_EXPERIENCE_VERSION='2026-08-23.14'" "$tmp/home.js" \
              && grep -Fq 'oshiru-affiliate-ui-version" content="2026-08-23.16' "$tmp/index.html" \
              && grep -Fq '/affiliate-widget.js?v=20260823-16' "$tmp/index.html" \
              && curl --fail --silent --show-error --location "$base/affiliate-widget.js?v=20260823-16-$attempt" -o "$tmp/affiliate.js" \
              && grep -Fq "AFFILIATE_UI_VERSION='2026-08-23.16'" "$tmp/affiliate.js" \
              && curl --max-time 12 --fail --silent --show-error --location "$base/latest-goods?v=23-$attempt" -o "$tmp/latest.html" \
              && grep -Fq 'oshiru-feed-version" content="2026-09-08.23' "$tmp/latest.html" \
              && curl --max-time 12 --fail --silent --show-error --location "$base/latest-feed.js?v=23-$attempt" -o "$tmp/feed.js" \
              && grep -Fq "VERSION='2026-09-08.23'" "$tmp/feed.js"; then
              ready=1; break
            fi
            sleep 5
          done
          test "$ready" = 1
          bash .github/scripts/verify-production-seo.sh "$base" "$tmp" 45

          curl --fail --silent --show-error --location "$base/?v=$(date +%s)" -o "$tmp/index.html"
          grep -Fq 'OSHIRU' "$tmp/index.html"
          grep -Fq '/gallery-v8.css?v=20260908-22' "$tmp/index.html"
          grep -Fq '/home-experience-v8.js?v=20260823-14' "$tmp/index.html"
          grep -Fq '/affiliate-widget.js?v=20260823-16' "$tmp/index.html"
          grep -Fq '/navigation-extra-v7.js?v=20260822-9' "$tmp/index.html"
          curl --fail --silent --show-error --location "$base/seo-structured-data.js?v=$(date +%s)" -o "$tmp/seo.js"
          ! grep -Fq 'loadScript' "$tmp/seo.js"

          grep -Fq 'repeat(8,minmax(0,1fr))' "$tmp/gallery.css"
          grep -Fq 'repeat(7,minmax(0,1fr))' "$tmp/gallery.css"
          grep -Fq 'repeat(3,minmax(0,1fr))' "$tmp/gallery.css"
          grep -Fq '#sourceAccessPanel{display:none!important}' "$tmp/gallery.css"
          grep -Fq '.gallery-compare::before' "$tmp/gallery.css"
          grep -Fq '.image-search-head{min-height:48px;padding-right:58px' "$tmp/gallery.css"

          curl --fail --silent --show-error --location "$base/navigation-extra-v7.js?v=$(date +%s)" -o "$tmp/nav.js"
          grep -Fq '画像検索' "$tmp/nav.js"
          grep -Fq '最新グッズ' "$tmp/nav.js"

          curl --fail --silent --show-error --location "$base/latest-goods?v=$(date +%s)" -o "$tmp/latest.html"
          grep -Fq 'data-official-rail' "$tmp/latest.html"
          grep -Fq 'CollectionPage' "$tmp/latest.html"

          curl --fail --silent --show-error --location "$base/api/search?q=" -o "$tmp/idle.json"
          node -e "const d=require(process.argv[1]);if(!d.idle||!Array.isArray(d.items)||d.items.length!==0)throw new Error('idle search regression')" "$tmp/idle.json"

          curl --max-time 12 --fail --silent --show-error --location "$base/api/status" -o "$tmp/integrations.json"
          node -e "const d=require(process.argv[1]);if(d.integrationVersion!=='2026-09-07.21'||d.healthChecked!==false||d.providers.length!==7)throw new Error('integration capability contract regression')" "$tmp/integrations.json"

          curl --max-time 12 --fail --silent --show-error --location "$base/api/search?initial=1&q=%E4%BA%94%E6%9D%A1%E6%82%9F%20%E3%82%B5%E3%83%B3%E3%83%AA%E3%82%AA" -o "$tmp/initial.json"
          node -e "const d=require(process.argv[1]);if(!d.initial||d.precisionVersion!=='2026-09-06.19'||!Array.isArray(d.items))throw new Error('initial snapshot regression')" "$tmp/initial.json"

          curl --max-time 15 --fail --silent --show-error --location "$base/api/live-search-v8?q=%E3%83%8A%E3%83%AB%E3%83%88" -o "$tmp/naruto.json"
          node - "$tmp/naruto.json" <<'NODE'
          const fs=require('fs');const d=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          if(d.precisionVersion!=='2026-09-06.19')throw new Error('precision version is not v18');
          if(!String(d.effectiveQuery||'').includes('NARUTO')||!String(d.effectiveQuery||'').includes('グッズ'))throw new Error(`NARUTO effective query invalid: ${d.effectiveQuery}`);
          const bad=/(ヘアピン|ヘアクリップ|髪留め|コミック|単行本|電子書籍)/i;
          const offending=(d.items||[]).filter(x=>bad.test(String(x.title||'')));
          if(offending.length)throw new Error(`non-merch noise remains: ${offending.map(x=>x.title).join(' / ')}`);
          console.log({narutoItems:(d.items||[]).length,effectiveQuery:d.effectiveQuery});
          NODE

      - name: Install Chromium runtime
        shell: bash
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Verify delayed, empty and failed search lifecycle
        run: node scripts/verify-search-lifecycle.cjs

      - name: Verify live multi-merchant image feed
        run: OSHIRU_FEED_LIVE=1 node scripts/verify-latest-feed.cjs

      - name: Verify visual guide and search navigation
        run: node scripts/verify-guide.cjs

      - name: Verify mobile and desktop layouts in real browser
        shell: bash
        run: |
          mkdir -p verification/screenshots
          node <<'NODE'
          const fs=require('fs');
          const {chromium}=require('playwright');
          const base='https://oshiruoshi.vercel.app';
          const intersects=(a,b)=>Math.max(a.left,b.left)<Math.min(a.right,b.right)&&Math.max(a.top,b.top)<Math.min(a.bottom,b.bottom);

          async function inspect(browser,name,viewport,expectedColumns){
            const context=await browser.newContext({viewport,locale:'ja-JP',isMobile:viewport.width<600,hasTouch:viewport.width<600});
            await context.addInitScript(()=>{if(window.top!==window||location.origin!=='https://oshiruoshi.vercel.app')return;localStorage.setItem('oshiru-v5-favs','{broken');localStorage.setItem('oshiru-v5-watch','null')});
            const page=await context.newPage();
            const network=[],pageErrors=[];
            page.on('pageerror',error=>{pageErrors.push(String(error));console.error(`${name}-pageerror`,error)});
            page.on('console',message=>{if(['error','warning'].includes(message.type()))console.log(`${name}-console-${message.type()}`,message.text(),message.location())});
            page.on('response',response=>{if(/\/api\/(?:search|live-search-v8)/.test(response.url()))network.push({kind:'response',status:response.status(),url:response.url()})});
            page.on('requestfailed',request=>{if(/\/api\/(?:search|live-search-v8)/.test(request.url()))network.push({kind:'failed',error:request.failure()?.errorText||'',url:request.url()})});
            await page.goto(`${base}/?q=${encodeURIComponent('五条悟 アクスラ')}&verify=${Date.now()}`,{waitUntil:'domcontentloaded',timeout:45000});
            await page.waitForFunction(()=>document.querySelectorAll('#productGrid .product-card[data-card-id]').length>=2,null,{timeout:15000}).catch(()=>{});
            const startup=await page.evaluate(()=>{
              const grid=document.getElementById('productGrid'),empty=document.getElementById('emptyState'),results=document.getElementById('results'),button=document.getElementById('searchBtn');
              return{
                readyState:document.readyState,url:location.href,query:document.getElementById('q')?.value||'',bodyClass:document.body.className,
                uiVersion:document.querySelector('meta[name="oshiru-search-ui-version"]')?.content||'',homeVersion:document.querySelector('meta[name="oshiru-home-version"]')?.content||'',affiliateVersion:document.querySelector('meta[name="oshiru-affiliate-ui-version"]')?.content||'',diagnostics:window.__OSHIRU_SEARCH_DIAGNOSTICS__||null,
                buttonText:button?.textContent?.trim()||'',buttonClass:button?.className||'',cards:grid?.querySelectorAll('.product-card[data-card-id]').length||0,
                skeletons:grid?.querySelectorAll('.skeleton').length||0,gridText:grid?.textContent?.trim().slice(0,300)||'',emptyText:empty?.textContent?.trim().slice(0,300)||'',
                emptyHidden:empty?.classList.contains('hidden'),resultsDisplay:results?getComputedStyle(results).display:'missing',
                assets:performance.getEntriesByType('resource').filter(entry=>/\/(?:app|performance-v3|seo-query-bridge|home-experience-v8|affiliate-widget)\.js/.test(entry.name)).map(entry=>({name:entry.name,duration:Math.round(entry.duration),transferSize:entry.transferSize}))
              };
            });
            console.log(`${name}-startup-diagnostics`,JSON.stringify({...startup,network}));
            await page.screenshot({path:`verification/screenshots/${name}-startup.png`,fullPage:false});
            if(startup.cards<2)throw new Error(`${name}: startup search did not render merchandise: ${JSON.stringify({...startup,network})}`);
            await page.waitForTimeout(1200);

            const metrics=await page.evaluate(()=>{
              const grid=document.querySelector('#productGrid'),cards=[...document.querySelectorAll('#productGrid .product-card[data-card-id]')],card=cards[0];
              const visual=card?.querySelector('.visual');
              const source=card?.querySelector('.source-pill'),price=card?.querySelector('.gallery-price'),heart=card?.querySelector('.heart'),compare=card?.querySelector('.gallery-compare');
              const rect=el=>el?Object.fromEntries(['left','right','top','bottom','width','height'].map(k=>[k,el.getBoundingClientRect()[k]])):null;
              const visible=el=>!!el&&getComputedStyle(el).display!=='none'&&getComputedStyle(el).visibility!=='hidden'&&el.getBoundingClientRect().width>0&&el.getBoundingClientRect().height>0;
              const inside=(child,parent)=>{const c=child?.getBoundingClientRect(),p=parent?.getBoundingClientRect();return!!c&&!!p&&c.left>=p.left-1&&c.right<=p.right+1&&c.top>=p.top-1&&c.bottom<=p.bottom+1};
              const gridStyle=grid?getComputedStyle(grid):null;
              const search=document.querySelector('.search-panel')?.getBoundingClientRect(),gridRect=grid?.getBoundingClientRect();
              return{
                uiVersion:document.querySelector('meta[name="oshiru-search-ui-version"]')?.content||'',
                homeVersion:document.querySelector('meta[name="oshiru-home-version"]')?.content||'',
                affiliateVersion:document.querySelector('meta[name="oshiru-affiliate-ui-version"]')?.content||'',
                diagnostics:window.__OSHIRU_SEARCH_DIAGNOSTICS__||null,
                cards:cards.length,
                titleFont:parseFloat(getComputedStyle(card.querySelector('.product-title')).fontSize),
                summaryVisible:visible(document.getElementById('resultMeta')),
                sortVisible:visible(document.getElementById('sort')),
                summary:document.getElementById('resultMeta')?.textContent,
                detailVisible:visible(card.querySelector('.card-detail')),
                freshnessVisible:visible(card.querySelector('.card-freshness')),
                structuredDataValid:[...document.querySelectorAll('script[data-oshiru-structured]')].some(node=>JSON.parse(node.textContent)['@graph']?.length>=2),
                columns:gridStyle?.gridTemplateColumns?.split(/\s+/).filter(Boolean).length||0,
                sourceVisible:visible(source),priceVisible:visible(price),heartVisible:visible(heart),compareVisible:visible(compare),
                controlsInsideVisual:[source,price,heart,compare].every(control=>inside(control,visual)),
                heartText:heart?.textContent?.trim()||'',compareText:compare?.textContent?.trim()||'',
                heartRect:rect(heart),compareRect:rect(compare),sourceRect:rect(source),priceRect:rect(price),
                sourcePanelPresent:!!document.getElementById('sourceAccessPanel'),
                sourceStripVisible:visible(document.querySelector('.source-strip')),
                betaVisible:visible(document.querySelector('.beta-bar')),
                gridInsideViewport:!!gridRect&&gridRect.left>=-1&&gridRect.right<=innerWidth+1,
                bodyOverflow:document.documentElement.scrollWidth>innerWidth+2,
                searchToGridGap:search&&gridRect?gridRect.top-search.bottom:null
              };
            });
            console.log(name,JSON.stringify(metrics));
            await page.screenshot({path:`verification/screenshots/${name}-search.png`,fullPage:false});
            if(metrics.uiVersion!=='2026-09-08.24'||metrics.homeVersion!=='2026-08-23.14'||metrics.affiliateVersion!=='2026-08-23.16'||metrics.diagnostics?.version!=='2026-09-08.24')throw new Error(`${name}: stale search UI loaded: ${JSON.stringify({uiVersion:metrics.uiVersion,homeVersion:metrics.homeVersion,affiliateVersion:metrics.affiliateVersion,diagnostics:metrics.diagnostics})}`);
            if(metrics.columns!==expectedColumns)throw new Error(`${name}: expected ${expectedColumns} columns, got ${metrics.columns}`);
            if(metrics.titleFont<12||!metrics.summaryVisible||!metrics.sortVisible||!metrics.detailVisible)throw new Error(`${name}: readability or search feedback missing`);
            if(!metrics.freshnessVisible)throw new Error(`${name}: item confirmation timestamp missing`);
            if(!metrics.summary.includes('として検索')||!metrics.structuredDataValid)throw new Error(`${name}: correction or structured data missing`);
            if(metrics.cards<2||!metrics.sourceVisible||!metrics.priceVisible||!metrics.heartVisible||!metrics.compareVisible)throw new Error(`${name}: card controls/source/price missing`);
            if(!metrics.controlsInsideVisual)throw new Error(`${name}: card overlays escaped the image area`);
            if(!['♡','♥'].includes(metrics.heartText))throw new Error(`${name}: heart text broken: ${metrics.heartText}`);
            if(metrics.compareText!=='＋')throw new Error(`${name}: compare text broken: ${metrics.compareText}`);
            if(metrics.heartRect.width<27||metrics.heartRect.height<27||metrics.compareRect.width<27||metrics.compareRect.height<27)throw new Error(`${name}: tap targets too small`);
            if(metrics.sourcePanelPresent||metrics.sourceStripVisible||metrics.betaVisible)throw new Error(`${name}: legacy source panels remain visible`);
            if(metrics.bodyOverflow||!metrics.gridInsideViewport)throw new Error(`${name}: horizontal layout overflow`);
            if(viewport.width<600&&Number(metrics.searchToGridGap)>140)throw new Error(`${name}: merchandise grid is too far below search (${metrics.searchToGridGap}px)`);

            const searchStarted=Date.now();
            if(viewport.width<=900){
              await page.locator('#q').click();
              await page.locator('#mobilePredictiveSearch').waitFor({state:'visible'});
              await page.locator('#mobilePredictiveInput').fill('なると');
              await page.getByRole('button',{name:'この言葉で検索',exact:true}).click();
              await page.locator('#mobilePredictiveSearch').waitFor({state:'hidden'});
            }else{
              await page.locator('#q').fill('なると');
              await page.locator('#searchBtn').click();
            }
            await page.waitForFunction(expectedQuery=>{
              const button=document.getElementById('searchBtn');
              const diagnostics=window.__OSHIRU_SEARCH_DIAGNOSTICS__;
              return button&&!button.classList.contains('loading')&&button.textContent.trim()!=='検索中…'&&!document.querySelector('#productGrid .skeleton')&&diagnostics?.query===expectedQuery&&diagnostics?.liveQuery===expectedQuery&&diagnostics?.live==='complete';
            },'なると',{timeout:16000});
            await page.waitForFunction(()=>document.querySelectorAll('#productGrid .product-card[data-card-id]').length>=6,null,{timeout:15000});
            const searchSettlement=await page.evaluate(started=>({
              elapsedMs:Date.now()-started,
              buttonText:document.getElementById('searchBtn')?.textContent?.trim()||'',
              skeletons:document.querySelectorAll('#productGrid .skeleton').length,
              cards:document.querySelectorAll('#productGrid .product-card[data-card-id]').length,
              emptyVisible:!document.getElementById('emptyState')?.classList.contains('hidden'),
              diagnostics:window.__OSHIRU_SEARCH_DIAGNOSTICS__||null,
              titles:[...document.querySelectorAll('#productGrid .product-title')].map(node=>node.textContent.trim())
            }),searchStarted);
            if(searchSettlement.elapsedMs>15000||searchSettlement.skeletons!==0)throw new Error(`${name}: search did not settle: ${JSON.stringify(searchSettlement)}`);
            if(searchSettlement.cards<6||searchSettlement.diagnostics?.query!=='なると'||searchSettlement.diagnostics?.liveQuery!=='なると'||searchSettlement.diagnostics?.live!=='complete')throw new Error(`${name}: search did not return live merchandise: ${JSON.stringify(searchSettlement)}`);
            if(searchSettlement.titles.some(title=>/(ヘアピン|ヘアクリップ|髪留め|コミック|単行本|電子書籍)/i.test(title)))throw new Error(`${name}: NARUTO search returned retail noise: ${JSON.stringify(searchSettlement.titles)}`);
            console.log(`${name}-search-settlement`,JSON.stringify(searchSettlement));

            await page.locator('#providerDetailsBtn').click();
            await page.getByRole('heading',{name:'データ接続状況',exact:true}).waitFor({state:'visible'});
            await page.waitForFunction(()=>document.querySelectorAll('#modalContent .setting-row').length>=7,null,{timeout:6000});
            const integrations=await page.locator('#modalContent').innerText();
            if(!integrations.includes('Amazon')||!integrations.includes('外部検索のみ')||!integrations.includes('接続成功と判定しません'))throw new Error(`${name}: integration state is misleading`);
            await page.locator('#modalClose').click();
            await page.locator('#externalSitesBtn').click();
            const quickLinks=await page.locator('#modalContent .external-sites-grid a').evaluateAll(nodes=>nodes.map(node=>node.href));
            if(quickLinks.length!==8||quickLinks.some(url=>!decodeURIComponent(url).includes('NARUTO')))throw new Error(`${name}: quick site search lost the current query`);
            if(!(await page.locator('#modalContent').innerText()).includes('API未接続'))throw new Error(`${name}: unsupported API implied to be live`);
            await page.locator('#modalClose').click();
            await page.locator('.external-search summary').click();
            const external=await page.locator('#externalSearchLinks a').evaluateAll(nodes=>nodes.map(node=>({label:node.textContent,url:node.href})));
            if(external.length!==8||!external.some(link=>link.url.includes('search.yahoo.co.jp'))||!external.some(link=>link.label.includes('Amazon'))||external.some(link=>!decodeURIComponent(link.url).includes('NARUTO')))throw new Error(`${name}: direct searches lost the corrected query`);
            await page.locator('.external-search summary').click();
            console.log(`${name}-integrations`,JSON.stringify({externalLinks:external.length,confirmationTimesVisible:metrics.freshnessVisible,dialog:true}));

            const responsive=[];
            for(const [width,columns] of (viewport.width<600?[[320,2]]:[[768,5],[1920,8]])){
              await page.setViewportSize({width,height:900});
              const layout=await page.evaluate(()=>{
                const grid=document.getElementById('productGrid'),rect=grid.getBoundingClientRect();
                const meta=document.getElementById('resultMeta');
                return{width:innerWidth,columns:getComputedStyle(grid).gridTemplateColumns.split(/\s+/).length,overflow:document.documentElement.scrollWidth>innerWidth+2||rect.right>innerWidth+1,summaryVisible:meta.getBoundingClientRect().height>0};
              });
              if(layout.columns!==columns||layout.overflow||!layout.summaryVisible)throw new Error(`${name}: responsive regression ${JSON.stringify(layout)}`);
              responsive.push(layout);
            }
            await page.setViewportSize(viewport);

            await page.locator('#imageSearchBtn').click({force:true});
            await page.waitForSelector('.modal.image-search-open',{state:'visible',timeout:10000});
            const modal=await page.evaluate(()=>{
              const h=document.querySelector('.image-search-head h2'),x=document.querySelector('.modal.image-search-open .modal-close, .modal.image-search-open #modalClose, .modal.image-search-open #modalCloseV8');
              const rect=el=>{const r=el?.getBoundingClientRect();return r?{left:r.left,right:r.right,top:r.top,bottom:r.bottom,width:r.width,height:r.height}:null};
              return{heading:rect(h),close:rect(x),closeText:x?.textContent?.trim()||''};
            });
            if(!modal.heading||!modal.close)throw new Error(`${name}: image-search heading/close missing`);
            if(intersects(modal.heading,modal.close))throw new Error(`${name}: image-search close overlaps heading`);
            if(modal.close.width<40||modal.close.height<40)throw new Error(`${name}: image-search close target too small`);
            await page.screenshot({path:`verification/screenshots/${name}-image-search.png`,fullPage:false});

            await page.goto(`${base}/latest-goods?verify=${Date.now()}`,{waitUntil:'domcontentloaded',timeout:45000});
            await page.waitForSelector('[data-official-rail]',{state:'visible',timeout:20000});
            const initialRailLeft=await page.locator('[data-official-rail]').evaluate(el=>el.scrollLeft);
            await page.waitForTimeout(4700);
            const latest=await page.evaluate(initialRailLeft=>({
              previewCards:document.querySelectorAll('.official-preview-card').length,
              sourceCards:document.querySelectorAll('.official-source-card').length,
              sourceLabels:document.querySelectorAll('.official-preview-source').length,
              railToggleVisible:document.getElementById('railToggle')?.getBoundingClientRect().width>0,
              autoMoved:document.querySelector('[data-official-rail]')?.scrollLeft>initialRailLeft+2,
              visibleExpired:[...document.querySelectorAll('[data-live-until]')].filter(el=>Date.parse(el.dataset.liveUntil)<Date.now()&&el.getClientRects().length>0).length,
              overflow:document.documentElement.scrollWidth>innerWidth+2
            }),initialRailLeft);
            console.log(`${name}-latest`,JSON.stringify(latest));
            await page.screenshot({path:`verification/screenshots/${name}-latest.png`,fullPage:false});
            if(latest.previewCards<3||latest.sourceCards<10||latest.sourceLabels<3||!latest.railToggleVisible||!latest.autoMoved||latest.overflow||latest.visibleExpired)throw new Error(`${name}: latest-goods layout/source/rotation regression`);
            await context.close();
            if(pageErrors.length)throw new Error(`${name}: browser runtime errors ${JSON.stringify(pageErrors)}`);
            return{...metrics,searchSettlement,responsive,imageSearch:modal,latest};
          }

          (async()=>{
            const browser=await chromium.launch({headless:true});
            try{
              const mobile=await inspect(browser,'mobile-390x844',{width:390,height:844},3);
              const desktop=await inspect(browser,'desktop-1440x900',{width:1440,height:900},7);
              fs.writeFileSync('verification/v9-ui-metrics.json',JSON.stringify({checkedAt:new Date().toISOString(),mobile,desktop},null,2)+'\n');
            }finally{await browser.close()}
          })().catch(error=>{console.error(error);process.exit(1)});
          NODE

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v9-production-screenshots
          path: verification/screenshots/*.png
          if-no-files-found: warn
          retention-days: 7

      - name: Record successful v9 verification
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          node <<'NODE'
          const fs=require('fs');const ui=JSON.parse(fs.readFileSync('verification/v9-ui-metrics.json','utf8'));
          fs.writeFileSync('verification/v9-production.json',JSON.stringify({
            ok:true,production:'https://oshiruoshi.vercel.app',checkedAt:new Date().toISOString(),workflowSha:process.env.GITHUB_SHA,
