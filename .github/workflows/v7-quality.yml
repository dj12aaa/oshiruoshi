name: V7 search and layout quality

on:
  push:
    branches:
      - work/fix-grid-search-v7
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: JavaScript syntax
        run: |
          node --check api/live-search.js
          node --check api/search-language.mjs
          node --check home-experience-v7.js
          node --check navigation-extra-v7.js
          node --check latest-goods.js
          node --check seo-structured-data.js
          node --check app.js
          node --check performance-v3.js

      - name: Search relevance regression cases
        run: |
          node --input-type=module <<'NODE'
          import {buildSearchVariants,detectIntent} from './api/search-language.mjs';
          import {oshiMerchBias} from './api/live-search.js';
          const cases=['五条悟 アクスタ','Felix ボイスキーホルダー','キリコ ぬい','ローレン・イロアス アクキー'];
          for(const q of cases){
            const variants=buildSearchVariants(q,5);
            if(!variants.length)throw new Error(`no search variants: ${q}`);
            if(!variants.some(v=>String(v.query).trim()))throw new Error(`blank variants: ${q}`);
          }
          const merch={title:'五条悟 公式 アクリルスタンド 限定グッズ',type:'アクスタ',tags:['五条悟','呪術廻戦']};
          const noise={title:'なると ヘアピン 2個セット レディース 日用品',type:'通販',tags:['ヘアピン']};
          const merchBias=oshiMerchBias(merch,'五条悟');
          const noiseBias=oshiMerchBias(noise,'五条悟');
          if(merchBias-noiseBias<60)throw new Error(`oshi merchandise separation too weak: ${merchBias}/${noiseBias}`);
          if(!detectIntent('Felix ボイスキーホルダー').merchGroups.length)throw new Error('voice-keyholder intent missing');
          console.log({cases:'ok',merchBias,noiseBias});
          NODE

      - name: Ensure precision-first live search architecture
        run: |
          node <<'NODE'
          const fs=require('fs');
          const live=fs.readFileSync('api/live-search.js','utf8');
          for(const token of ['MAX_VARIANTS=5','countStrongMatches','robustVariants','oshiMerchBias','SEARCH_ALIAS_VERSION=\'2026-08-21.7\''])if(!live.includes(token))throw new Error(`search invariant missing: ${token}`);
          for(const forbidden of ['diversifySources','single-fast-provider-query'])if(live.includes(forbidden))throw new Error(`precision regression token present: ${forbidden}`);
          const search=fs.readFileSync('api/search.js','utf8');
          if(!search.includes("idle:true")||!search.includes("items:[]"))throw new Error('empty search idle guard missing');
          NODE

      - name: Validate stable gallery geometry
        run: |
          node <<'NODE'
          const fs=require('fs');
          const css=fs.readFileSync('gallery-v7.css','utf8');
          for(const token of ['repeat(8,minmax(0,1fr))','repeat(7,minmax(0,1fr))','repeat(6,minmax(0,1fr))','repeat(5,minmax(0,1fr))','repeat(4,minmax(0,1fr))','repeat(3,minmax(0,1fr))','.gallery-price','.gallery-compare','aspect-ratio:1/1!important','overflow-x:hidden'])if(!css.includes(token))throw new Error(`gallery invariant missing: ${token}`);
          const open=(css.match(/\{/g)||[]).length,close=(css.match(/\}/g)||[]).length;if(open!==close)throw new Error(`gallery CSS braces ${open}/${close}`);
          const home=fs.readFileSync('home-experience-v7.js','utf8');
          for(const token of ['createImageBitmap','fetchPriority','gallery-price','gallery-compare','/api/vision-search','imageSearch'])if(!home.includes(token))throw new Error(`gallery JS invariant missing: ${token}`);
          NODE

      - name: Validate latest goods visual rail and SEO
        run: |
          node <<'NODE'
          const fs=require('fs');
          const html=fs.readFileSync('latest-goods.html','utf8'),css=fs.readFileSync('latest-goods.css','utf8'),js=fs.readFileSync('latest-goods.js','utf8');
          for(const token of ['data-official-rail','official-preview-card','shop.nijisanji.jp/on/demandware.static','shop.hololivepro.com/cdn/shop','jujutsukaisen.jp/news/images','straykidsjapan.com/runitjapan/img','CollectionPage','ItemList','navigation-extra-v7.js','home-experience-v7.js'])if(!html.includes(token))throw new Error(`latest hub invariant missing: ${token}`);
          if(/"@type":"(?:Product|MerchantListing)"/.test(html))throw new Error('merchant schema must not be used on latest hub');
          for(const token of ['scroll-snap-type:x mandatory','height:220px','overflow-x:auto','image-failed'])if(!css.includes(token))throw new Error(`rail layout invariant missing: ${token}`);
          for(const token of ['setInterval(advance,4200)','pointerdown','prefers-reduced-motion','is-failed'])if(!js.includes(token))throw new Error(`rail behavior invariant missing: ${token}`);
          NODE

      - name: Validate taskbar extensions and function budget
        run: |
          node <<'NODE'
          const fs=require('fs');
          const nav=fs.readFileSync('navigation-extra-v7.js','utf8');
          for(const token of ['画像検索','最新グッズ','data-open-image-search','/latest-goods'])if(!nav.includes(token))throw new Error(`dock extension missing: ${token}`);
          const seo=fs.readFileSync('seo-structured-data.js','utf8');
          for(const token of ['/gallery-v7.css?v=20260821-7','/home-experience-v7.js?v=20260821-7','/navigation-extra-v7.js?v=20260821-7'])if(!seo.includes(token))throw new Error(`home bootstrap missing: ${token}`);
          if(seo.includes('home-experience-v6.js'))throw new Error('v6 home bootstrap still active');
          const funcs=fs.readdirSync('api').filter(f=>f.endsWith('.js')&&!f.startsWith('_'));
          if(funcs.length>12)throw new Error(`Vercel function budget exceeded: ${funcs.length}`);
          console.log({apiFunctions:funcs.length});
          NODE
